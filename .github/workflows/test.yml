name: test

# 测试必须独立于发布流程：build.yml 仅由 tag push / workflow_dispatch 触发，
# 测试若挂在它下面，就只在发版时执行——2026-09 的 Windows「os error 5」回归
# 正是这样漏到 0.1.43 的。本 workflow 在 push 与 PR 上即触发。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 三平台结果一次跑齐：任一平台失败不阻塞其余平台出结果。
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # 与 build.yml 分开的 key 前缀（那边是 release profile 产物），
      # restore-keys 回落到它的缓存，以复用依赖编译产物。
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      # 只跑 core：零 tauri 依赖，不需要 webkit / npm / 前端 dist。
      # 不传 --target，用 runner 原生 target——build.yml 的 mac-x64 是 arm runner 上
      # 交叉编译 x86_64，跑测试需要 Rosetta，不适用于本 job。
      - name: Run tests
        run: cargo test -p wb-switch-core

      # linux 专属 cfg 分支只在 ubuntu 上展开（macOS 侧由 lint job 覆盖）。
      # rust-embed 要求 #[folder] 目录存在，先建 dist 占位（前端产物由 build.yml 产出）。
      - name: Clippy (linux cfg)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cargo clippy -p wb-switch-core -p wb-switch-server --all-targets --no-deps -- -D warnings

  # 前端类型、格式与 lint 门禁。跑在 macOS 上：clippy 按宿主平台展开 cfg 分支，
  # 与开发者本机一致，本地全绿即 CI 全绿。linux 专属分支由 rust-tests 的 ubuntu
  # job 覆盖，windows 分支暂未纳入。
  # clippy 必须带 --no-deps：vendor/agent-companion 是 path 依赖快照，其告警不归本仓库。
  lint:
    name: lint (tsc + fmt + clippy + server tests)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # 与 rust-tests 相同的 key 前缀，直接复用依赖编译产物。
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # tsc 顺带产出 dist：clippy 检查 src-tauri 时 tauri-build 要求 frontendDist 存在。
      - name: Type-check and build frontend
        run: npm run build

      # tauri-build 还要求 externalBin 存在。这里只放占位文件让编译检查通过；
      # 真实 runtime 由 build.yml（发版）与 scripts/prepare-agent-companion.mjs 产出。
      - name: Stub companion runtime binary
        run: |
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/agent-studio-runtime-$(rustc -vV | sed -n "s/^host: //p")"

      - name: Check formatting
        run: cargo fmt --check -p wb-switch-core -p wb-switch-server -p wb-switch-rust

      - name: Clippy
        run: cargo clippy -p wb-switch-core -p wb-switch-server -p wb-switch-rust --all-targets --no-deps -- -D warnings

      # server 的 8 个测试此前从不运行（rust-tests 只覆盖 core）。
      - name: Server tests
        run: cargo test -p wb-switch-server

      # src-tauri 的 40 个测试此前从不运行（rust-tests 只覆盖 core）。
      # 前置 dist 与 stub companion binary 已由上方步骤就位。
      - name: Desktop app tests
        run: cargo test -p wb-switch-rust

  # 兜底门禁：`lint` 绑定在 macos-14 上，拿不到该 runner 的环境里它会被直接取消
  # （fork 常见），于是 fmt / clippy / server 测试 / src-tauri 测试一次都不执行——
  # 而这些恰恰是改后端时唯一的编译验证，等于「改完 Rust 没人编译过」。
  # 这里用 windows-latest 复刻同一组检查：不追求替代 lint（macOS 专属 cfg 分支仍由它
  # 覆盖），只保证「改了 src-tauri 就一定有一台机器真的编译过」。
  desktop-gate:
    name: desktop gate (fmt + clippy + server/desktop tests, windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-gate-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-gate-
            ${{ runner.os }}-cargo-test-

      - name: Install frontend dependencies
        run: npm ci

      # tsc 顺带产出 dist：clippy 检查 src-tauri 时 tauri-build 要求 frontendDist 存在。
      - name: Type-check and build frontend
        run: npm run build

      # tauri-build 还要求 externalBin 存在。Windows 侧的 externalBin 带 .exe 后缀，
      # 与 macOS 只需裸文件名不同；两个都建，避免因宿主差异漏建。
      - name: Stub companion runtime binary
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          host=$(rustc -vV | sed -n 's/^host: //p')
          touch "src-tauri/binaries/agent-studio-runtime-$host"
          touch "src-tauri/binaries/agent-studio-runtime-$host.exe"

      - name: Check formatting
        run: cargo fmt --check -p wb-switch-core -p wb-switch-server -p wb-switch-rust

      - name: Clippy
        run: cargo clippy -p wb-switch-core -p wb-switch-server -p wb-switch-rust --all-targets --no-deps -- -D warnings

      - name: Server tests
        run: cargo test -p wb-switch-server

      - name: Desktop app tests
        run: cargo test -p wb-switch-rust

  # 前端行为测试：纯逻辑单测（node 环境），不依赖 Rust 工具链。
  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
